name: project
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_map: ^8.3.2
  geolocator: ^14.1.1
  google_fonts: ^8.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  image: ^4.12.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: ^0.10.1
  path: ^1.9.1
  permission_handler: ^11.3.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+1
  supabase_flutter: ^2.18.3
  timezone: ^0.11.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - lib/img/logo.png
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/img/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "lib/img/logo.png"
  windows:
    generate: true
    image_path: "lib/img/logo.png"

